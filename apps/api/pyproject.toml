[project]
name = "nica-erp"
version = "0.1.0"
description = "Multi-tenant ERP SaaS for Nicaraguan SMBs"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "structlog>=24,<25",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "asyncpg>=0.30,<1.0",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.13,<2.0",
]

[dependency-groups]
dev = [
  "ruff>=0.6,<1.0",
  "mypy>=1.11,<2.0",
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1.0",
  "httpx>=0.27,<1.0",
  "respx>=0.21,<1.0",
  "import-linter>=2,<3",
  "pre-commit>=3,<5",
  "testcontainers[postgres]>=4,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bootstrap", "src/shared_kernel", "src/contexts"]
sources = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF", "N"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# FastAPI `Depends()` is conventionally used as a default value.
# Glob form so it matches whether ruff runs from `apps/api/` or the workspace root.
"**/bootstrap/api.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
files = ["src/shared_kernel", "src/contexts", "src/bootstrap"]
plugins = ["pydantic.mypy"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
  "shared_kernel.adapters.*",
  "contexts.*.adapters.*",
  "bootstrap.*",
]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
markers = [
  "unit: unit tests (no I/O, < 1ms)",
  "integration: integration tests (testcontainers, < 1s)",
  "contract: contract tests across adapters",
  "e2e: end-to-end tests through HTTP",
]
testpaths = ["tests"]
python_files = ["test_*.py"]
