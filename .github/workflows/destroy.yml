# destroy — tear down the ephemeral demo stack.
#
# Bootstrap (state bucket, ECR, CloudFront, OIDC, IAM roles) survives.
# To remove those, run `make destroy-bootstrap` locally (admin-only).

name: destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'nica-erp-ephemeral' to confirm"
        type: string
        required: true
      clean_web_assets:
        description: "Also empty the SPA bucket (default: keep)"
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: destroy
  cancel-in-progress: false

jobs:
  destroy:
    name: Destroy demo stack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_REGION: us-east-1
      DESTROY_WEB_ASSETS: ${{ inputs.clean_web_assets && '1' || '0' }}
      # envs/demo declares these as required (no default); terraform destroy
      # still reads variables.tf, so they must be present even when destroying.
      TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
      TF_VAR_from_address: ${{ vars.FROM_ADDRESS }}
      TF_VAR_cloudfront_distribution_id: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      # Mirror untrusted user inputs into env vars before any `run:` step
      # interpolates them — protects against shell injection if someone
      # types backticks or `$(...)` into the workflow_dispatch form.
      INPUT_CONFIRM: ${{ inputs.confirm }}
      INPUT_CLEAN_WEB_ASSETS: ${{ inputs.clean_web_assets }}

    steps:
      - name: Assert confirmation string
        run: |
          if [[ "$INPUT_CONFIRM" != "nica-erp-ephemeral" ]]; then
            echo "ERROR: confirm input must equal 'nica-erp-ephemeral' (got: '$INPUT_CONFIRM')." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DESTROY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - name: Destroy
        run: ./scripts/destroy.sh

      - name: Summarize
        if: always()
        # `job.status` is a GitHub-controlled context value (success/failure/cancelled),
        # not user input — mirrored into env here per the semgrep run-shell-injection rule.
        env:
          # nosemgrep: yaml.github-actions.security.run-shell-injection.run-shell-injection
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## Destroy ${JOB_STATUS}"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Confirmation | \`${INPUT_CONFIRM}\` |"
            echo "| Cleaned SPA bucket | \`${INPUT_CLEAN_WEB_ASSETS}\` |"
            echo "| Verify-destroyed | see log step output |"
          } >> "$GITHUB_STEP_SUMMARY"
